[project]
name = "nasems"
version = "0.1.0"
description = "Downloads photo galleries from the Naše MŠ kindergarten app (nasems.cz)"
authors = [{ name = "Honza Javorek", email = "mail@honzajavorek.cz" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
	"beautifulsoup4>=4.13",
	"click>=8.1.8",
]

[project.scripts]
nasems = "nasems.__main__:main"


[dependency-groups]
dev = [
	"mypy>=1.18",
	"pytest>=8.3",
	"pytest-mypy>=1.0",
	"pytest-ruff>=0.5",
	"pytest-xdist>=3.6",
	"ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["src", "tests"]
addopts = "--ff --ruff --ruff-format --mypy -n auto"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
extend-select = ["I", "C90", "UP", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.mypy]
strict = true
